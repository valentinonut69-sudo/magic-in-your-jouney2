<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SUPERRICH THAILAND — Halloween Magic Journey</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Tahoma",sans-serif;background:#22002f}
  body{touch-action:none}
  #game{position:relative;width:100vw;height:100vh;min-height:560px;overflow:hidden;background:#22002f}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.92) brightness(.72);z-index:0}
  .vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:
    radial-gradient(circle at 50% 40%,transparent 0 35%,rgba(20,0,32,.30) 72%,rgba(8,0,16,.72) 100%)}
  .topbar{position:absolute;z-index:5;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
  .pill{background:rgba(20,0,35,.78);border:1px solid rgba(210,255,0,.55);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;box-shadow:0 5px 18px #0007;backdrop-filter:blur(5px)}
  .pill b{color:#d8ff00}
  #arena{position:absolute;inset:0;z-index:2}
  .item{position:absolute;user-select:none;will-change:transform;display:flex;align-items:center;justify-content:center}
  .coin{width:58px;height:58px;border-radius:50%;font-size:30px;font-weight:900;border:4px solid #fff4;box-shadow:0 6px 20px #0009, inset 0 2px 8px #fff8;animation:spin 1.5s linear infinite}
  .usd{background:linear-gradient(145deg,#dfff00,#7cad00);color:#243000}
  .eur{background:linear-gradient(145deg,#f6d56a,#a96b00);color:#fff}
  .jpy{background:linear-gradient(145deg,#62fff1,#009a91);color:#062e2b}
  .ghost{font-size:44px;filter:drop-shadow(0 7px 7px #0008);animation:float 1.2s ease-in-out infinite alternate}
  .star{font-size:32px;color:#fff;filter:drop-shadow(0 0 9px #d8ff00)}
  #player{position:absolute;z-index:4;left:50%;bottom:32px;transform:translateX(-50%);width:112px;height:92px;border-radius:50% 50% 35% 35%;background:radial-gradient(circle at 50% 25%,#caff00 0 12%,#7d9500 13% 18%,#25213d 19% 100%);border:4px solid #d8ff00;box-shadow:0 8px 25px #000b,0 0 28px #d8ff0044;display:flex;align-items:center;justify-content:center;font-size:50px}
  #player:after{content:"✦";position:absolute;top:-25px;right:-16px;color:#fff;font-size:25px}
  #message{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,560px);background:rgba(28,0,43,.94);border:2px solid #d8ff00;border-radius:26px;padding:28px;text-align:center;color:#fff;box-shadow:0 25px 80px #000b}
  #message h1{margin:0 0 10px;font-size:clamp(28px,5vw,52px);color:#d8ff00;text-shadow:3px 3px 0 #008f89}
  #message p{line-height:1.55;margin:8px 0;color:#fff}
  button{border:0;border-radius:999px;padding:14px 28px;margin-top:14px;background:#d8ff00;color:#270033;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 8px 22px #0006}
  button:active{transform:scale(.96)}
  #controls{position:absolute;z-index:7;left:18px;bottom:18px;display:flex;gap:10px}
  .ctrl{width:58px;height:58px;border-radius:18px;border:1px solid #d8ff0088;background:#24002fcc;color:#d8ff00;font-size:28px;font-weight:900}
  #hint{position:absolute;z-index:5;right:16px;bottom:16px;color:#fff;background:#180022aa;padding:8px 12px;border-radius:12px;font-size:13px}
  @keyframes spin{to{transform:rotateY(360deg)}}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
  @media(max-width:650px){
    #player{bottom:88px;width:92px;height:76px;font-size:40px}
    #hint{display:none}
    .coin{width:50px;height:50px;font-size:25px}
    .topbar{top:8px}
    .pill{padding:7px 10px;font-size:13px}
  }
</style>
</head>

<script>
(() => {
  const arena = document.getElementById('arena');
  const player = document.getElementById('player');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const timeEl = document.getElementById('time');
  const message = document.getElementById('message');
  const startBtn = document.getElementById('start');

  let x=50, score=0, lives=3, time=30, running=false, last=0, spawn=0, clock=0, items=[];
  let left=false,right=false;

  const types = [
    {kind:'coin usd', emoji:'$', points:10, speed:170},
    {kind:'coin eur', emoji:'€', points:15, speed:190},
    {kind:'coin jpy', emoji:'¥', points:20, speed:220},
    {kind:'ghost', emoji:'👻', points:-1, speed:205},
    {kind:'star', emoji:'✦', points:5, speed:145}
  ];

  function resizeX() {
    const r = arena.getBoundingClientRect();
    const p = player.getBoundingClientRect();
    const px = (x/100)*r.width - p.width/2;
    player.style.left = Math.max(0, Math.min(r.width-p.width, px)) + 'px';
    player.style.transform = 'none';
  }

  function reset() {
    items.forEach(i=>i.el.remove()); items=[];
    score=0;lives=3;time=30;x=50;clock=0;spawn=0;last=performance.now();
    scoreEl.textContent=score;livesEl.textContent=lives;timeEl.textContent=time;
    resizeX();
  }

  function addItem() {
    const t=types[Math.floor(Math.random()*types.length)];
    const el=document.createElement('div');
    el.className='item '+t.kind;
    el.textContent=t.emoji;
    const r=arena.getBoundingClientRect();
    const px=10+Math.random()*80;
    el.style.left=px+'%'; el.style.top='-70px';
    arena.appendChild(el);
    items.push({el, x:px/100*r.width, y:-70, speed:t.speed*(.85+Math.random()*.4), points:t.points, dead:false});
  }

  function hit(a,b) {
    const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
    return ar.left < br.right && ar.right > br.left && ar.top < br.bottom && ar.bottom > br.top;
  }

  function endGame(title) {
    running=false;
    message.querySelector('h1').innerHTML=title+'<br><span style="font-size:.65em;color:#fff">SCORE '+score+'</span>';
    message.querySelector('p').innerHTML = score>=120
      ? '🎉 Magic Master! เก็บเงินได้ยอดเยี่ยม'
      : '✨ ลองอีกครั้งเพื่อทำคะแนนให้สูงขึ้น';
    startBtn.textContent='เล่นอีกครั้ง';
    message.style.display='block';
  }

  function loop(now) {
    if(!running) return;
    const dt=Math.min(.035,(now-last)/1000); last=now;
    clock+=dt; spawn+=dt;
    if(clock>=1) {
      clock=0; time--; timeEl.textContent=time;
      if(time<=0) return endGame('MAGIC COMPLETE');
    }
    if(spawn>.48) {spawn=0;addItem();}

    const r=arena.getBoundingClientRect();
    const p=player.getBoundingClientRect();
    const move=(right?1:0)-(left?1:0);
    x += move*55*dt;
    x=Math.max(5,Math.min(95,x)); resizeX();

    for(const it of items) {
      it.y += it.speed*dt;
      it.el.style.transform=`translateY(${it.y+70}px)`;
      if(!it.dead && hit(it.el,player)) {
        it.dead=true;
        if(it.points<0) {
          lives--; livesEl.textContent=lives;
          it.el.textContent='💥';
          if(lives<=0) return endGame('SPELL BROKEN');
        } else {
          score += it.points; scoreEl.textContent=score;
          it.el.textContent=it.points>=20?'💰':'✨';
        }
        setTimeout(()=>it.el.remove(),120);
      }
    }
    items=items.filter(it=>it.y<r.height+100 && !it.dead);
    requestAnimationFrame(loop);
  }

  function hold(btn, dir) {
    const on=()=>{if(dir==='left')left=true;else right=true};
    const off=()=>{left=false;right=false};
    btn.addEventListener('pointerdown',on); btn.addEventListener('pointerup',off);
    btn.addEventListener('pointercancel',off); btn.addEventListener('pointerleave',off);
  }
  hold(document.getElementById('left'),'left'); hold(document.getElementById('right'),'right');
  addEventListener('keydown',e=>{if(e.key==='ArrowLeft')left=true;if(e.key==='ArrowRight')right=true});
  addEventListener('keyup',e=>{if(e.key==='ArrowLeft')left=false;if(e.key==='ArrowRight')right=false});
  addEventListener('resize',resizeX);

  startBtn.onclick=()=>{reset();message.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)};
  resizeX();
})();
</script>
</body>
</html>
